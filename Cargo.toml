[package]
name = "ng-term"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Independent sci-fi terminal inspired by eDEX-UI — Rust + Vulkan"
license = "MIT"

[dependencies]
# Window + events
winit = "0.29"
raw-window-handle = "0.6"

# Vulkan
ash = "0.38"
ash-window = "0.13"

# WGSL -> SPIR-V compilation at startup (pure Rust, no glslc/shaderc)
naga = { version = "0.19", features = ["wgsl-in", "spv-out"] }

# Font rasterization
fontdue = "0.8"

# ANSI/VT sequence parser
vte = "0.13"
unicode-width = "0.1"

# System information (CPU, RAM, processes, network)
sysinfo = "0.30"

# PTY / fork / exec
libc = "0.2"

# Clock / date
chrono = "0.4"

# Loading eDEX-UI themes (*.json)
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = 3
