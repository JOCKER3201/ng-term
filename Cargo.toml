[package]
name = "ng-term"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Independent sci-fi terminal inspired by eDEX-UI — Rust + Vulkan"
license = "MIT"

[dependencies]
# Platform-independent base: drawing, fonts, themes, layout engine,
# terminal emulation, telemetry data model
lib-ng-base = { git = "https://github.com/JOCKER3201/lib-ng-base" }

# Interface objects: windows, dialogs, buttons, sliders, dropdowns, checkboxes
lib-ng-object = { git = "https://github.com/JOCKER3201/lib-ng-object" }

# The widgets themselves
lib-ng-widgets = { git = "https://github.com/JOCKER3201/lib-ng-widgets" }

# Window + events (Linux: Wayland/X11 backends)
winit = "0.29"
raw-window-handle = "0.6"

# Vulkan
ash = "0.38"
ash-window = "0.13"

# WGSL -> SPIR-V compilation at startup (pure Rust, no glslc/shaderc)
naga = { version = "0.19", features = ["wgsl-in", "spv-out"] }

# PTY events use the same VT parser as the emulation in lib-ng-base
vte = "0.13"

# System information collectors (CPU, RAM, processes, network)
sysinfo = "0.30"

# PTY / fork / exec (Linux)
libc = "0.2"

# Clock / date
chrono = "0.4"


[profile.release]
lto = "thin"
opt-level = 3
