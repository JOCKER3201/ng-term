[package]
name = "ng-term"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Independent sci-fi terminal inspired by eDEX-UI — Rust + Vulkan"
license = "MIT"

[dependencies]
# The toolkit: drawing, fonts, themes, the responsive layout engine,
# interface objects, the widget contract and its scripting, terminal
# emulation, telemetry and sound.
lib-ng = { git = "https://github.com/JOCKER3201/lib-ng" }

# The widgets shipped with the program.
widgets = { git = "https://github.com/JOCKER3201/widgets" }

# Window + events (Linux: Wayland/X11 backends)
winit = "0.29"
raw-window-handle = "0.6"

# Vulkan
ash = "0.38"
ash-window = "0.13"

# WGSL -> SPIR-V compilation at startup (pure Rust, no glslc/shaderc)
naga = { version = "0.19", features = ["wgsl-in", "spv-out"] }

# PTY events use the same VT parser as the emulation in lib-ng-base
vte = "0.13"

# System information collectors (CPU, RAM, processes, network)
sysinfo = "0.30"

# PTY / fork / exec (Linux)
# Raw system calls: the PTY (openpty/fork/execvp) and dlopen for the
# ALSA output in audio.rs — audio needs no build-time dependency.
libc = "0.2"

# Clock / date
chrono = "0.4"


[profile.release]
lto = "thin"
opt-level = 3
